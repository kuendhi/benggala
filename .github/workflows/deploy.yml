name: Deploy Benggala Python to cPanel

on:
  push:
    branches:
      - main
      - python-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Syntax Check
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Check All Python Files
        run: |
          python -m py_compile app.py passenger_wsgi.py core/*.py routes/*.py

      - name: Trigger Passenger Auto-Restart
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

      - name: FTP Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/venv/**
            **/.venv/**
            **/__pycache__/**
            **/*.pyc
            **/uploads/snapshots/*.jpg
