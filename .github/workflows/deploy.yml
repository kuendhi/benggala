name: Deploy Benggala Python to cPanel

on:
  push:
    branches:
      - main
      - python-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Syntax Check
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Check All Python Files
        run: |
          python -m py_compile app.py passenger_wsgi.py core/*.py routes/*.py

      - name: Trigger Passenger Auto-Restart
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

      - name: FTP Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/venv/**
            **/.venv/**
            **/__pycache__/**
            **/*.pyc
            **/uploads/snapshots/*.jpg
            **/uploads/knowledge/*.jpg

      - name: Clean Legacy PHP Files from FTP Server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python -c "
          import ftplib, os
          server = os.environ.get('FTP_SERVER')
          user = os.environ.get('FTP_USERNAME')
          passwd = os.environ.get('FTP_PASSWORD')
          remotedir = os.environ.get('FTP_SERVER_DIR', '').strip('/')
          if server and user and passwd:
              try:
                  ftp = ftplib.FTP(server, timeout=30)
                  ftp.login(user, passwd)
                  if remotedir:
                      for d in remotedir.split('/'):
                          if d:
                              ftp.cwd(d)
                  legacy_files = ['index.php', 'save_snapshot.php', 'analyze_llm.php', 'settings.php', 'history.php', 'export_csv.php', 'db.php', 'security.php', 'telegram.php']
                  for f in legacy_files:
                      try:
                          ftp.delete(f)
                          print(f'Successfully deleted legacy {f} from FTP')
                      except Exception as e:
                          print(f'File {f} not present or skipped: {e}')
                  ftp.quit()
              except Exception as e:
                  print('FTP cleanup warning:', e)
          "

